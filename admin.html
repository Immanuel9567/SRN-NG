<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Login — SIM Racing NG</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700&family=Barlow:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css"/>
  <script src="shared.js"></script>
</head>
<body>

<header class="site-header">
  <div class="header-left">
    <a href="index.html" class="back-btn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><polyline points="12 19 5 12 12 5"/></svg>
      Back
    </a>
  </div>
  <a href="index.html" class="header-logo">
    <img src="assets/logo.png" alt="SIM Racing NG" class="logo-img"/>
  </a>
  <div class="header-right">
    <button id="themeBtn" class="icon-round" title="Toggle theme">☀️</button>
    <button id="adminToggle" class="icon-round admin-toggle-btn" title="Admin Panel" style="display:none">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    </button>
  </div>
</header>

<div class="login-page">
  <div class="modal-glass login-box">
    <img src="assets/logo.png" alt="SRN" style="height:52px;margin:0 auto 1.5rem;display:block"/>
    <h2 class="login-title">Admin Sign In</h2>
    <p class="login-sub">Enter your admin credentials to access the panel.</p>
    <div class="ap-field"><label>Username</label><input type="text" id="loginUser" class="ap-input" placeholder="username" autocomplete="username"/></div>
    <div class="ap-field"><label>Password</label><input type="password" id="loginPass" class="ap-input" placeholder="••••••••" autocomplete="current-password"/></div>
    <div id="loginErr" class="ap-error" style="display:none"></div>
    <button class="btn-primary" style="width:100%;margin-top:4px" onclick="doLogin()">Sign In</button>
    <p style="text-align:center;font-size:12px;color:var(--text-muted);margin-top:1rem">
      Default: <code style="background:var(--navy-card);padding:2px 6px;border-radius:4px;font-size:11px">admin / admin123</code>
    </p>
  </div>
</div>

<!-- Shared modals for admin panel (after login redirect) -->
<div id="adminPanelOverlay" class="ap-overlay"></div>
<aside id="adminPanel" class="admin-panel">
  <!-- populated after login, user is redirected back to calling page -->
</aside>
<div class="modal-overlay" id="confirmModal" style="display:none">
  <div class="modal-glass confirm-modal">
    <h3 id="confirmTitle"></h3>
    <p id="confirmDesc" style="font-size:13px;color:var(--text-secondary);margin:8px 0 20px"></p>
    <div style="display:flex;gap:8px;justify-content:flex-end">
      <button class="btn-ghost btn-sm" id="confirmNo">Cancel</button>
      <button class="btn-danger btn-sm" id="confirmYes">Confirm</button>
    </div>
  </div>
</div>
<div id="srnToast" class="srn-toast"></div>

<script>
// Redirect if already logged in
if(getSession()) window.location.href='index.html';

function doLogin(){
  const username=document.getElementById('loginUser').value.trim().toLowerCase();
  const password=document.getElementById('loginPass').value;
  const errEl=document.getElementById('loginErr');
  errEl.style.display='none';
  if(!username||!password){errEl.textContent='Please enter username and password.';errEl.style.display='block';return;}
  const admin=getAdmins().find(a=>a.username.toLowerCase()===username&&a.password===password);
  if(!admin){errEl.textContent='Invalid username or password.';errEl.style.display='block';return;}
  setSession({id:admin.id,name:admin.name,username:admin.username,role:'admin'});
  setOnline(admin.username);
  window.location.href='index.html';
}
document.addEventListener('keydown',e=>{
  if(e.key==='Enter') doLogin();
});
</script>
</body>
</html>
