<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Driver Profile — SIM Racing NG</title>
  <meta name="description" content="Driver profile on SIM Racing Nigeria." />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <div class="container navbar-container">
      <a href="index.html" class="navbar-brand">
        <svg width="140" height="32" viewBox="0 0 200 45" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect width="45" height="45" rx="10" fill="#00E676"/>
          <path d="M12 33L22 12L32 33" stroke="#08080C" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M16 26H28" stroke="#08080C" stroke-width="4.5" stroke-linecap="round"/>
          <text x="58" y="24" fill="#FFFFFF" font-family="Orbitron, sans-serif" font-weight="900" font-size="16" letter-spacing="1">SIM RACING</text>
          <text x="58" y="38" fill="#00E676" font-family="Orbitron, sans-serif" font-weight="700" font-size="11" letter-spacing="3">NIGERIA</text>
        </svg>
      </a>

      <div class="navbar-links">
        <a href="gallery.html" class="nav-link">Gallery</a>
        <a href="activities.html" class="nav-link">Activities</a>
        <a href="news.html" class="nav-link">News</a>
        <a href="members.html" class="nav-link">Members</a>
        <a href="sim-rigs.html" class="nav-link">Rigs</a>
        <a href="media.html" class="nav-link">Media</a>
        <a href="shop.html" class="nav-link">Shop</a>
        <a href="about.html" class="nav-link">About</a>
      </div>

      <div class="navbar-actions">
        <span data-account-slot style="display: inline-flex; align-items: center; gap: 0.75rem;">
          <a href="account.html?mode=signin" class="btn btn-outline-light">SIGN IN</a>
          <a href="account.html" class="btn btn-primary">SIGN UP</a>
        </span>
      </div>

      <button class="mobile-toggle" aria-label="Toggle Navigation">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>
    </div>

    <!-- Mobile Drawer -->
    <div class="mobile-menu">
      <a href="gallery.html" class="mobile-nav-link">Gallery</a>
      <a href="activities.html" class="mobile-nav-link">Activities</a>
      <a href="news.html" class="mobile-nav-link">News</a>
      <a href="members.html" class="mobile-nav-link">Members</a>
      <a href="sim-rigs.html" class="mobile-nav-link">Rigs</a>
      <a href="media.html" class="mobile-nav-link">Media</a>
      <a href="shop.html" class="mobile-nav-link">Shop</a>
      <a href="about.html" class="mobile-nav-link">About</a>
      <div data-account-slot style="display: flex; flex-direction: column; gap: 0.5rem; margin-top: 0.5rem;">
        <a href="account.html" class="btn btn-primary" style="text-align: center;">SIGN UP</a>
        <a href="account.html?mode=signin" class="btn btn-outline-light" style="text-align: center;">SIGN IN</a>
      </div>
    </div>
  </nav>

  <main id="profile-container">
    <!-- Populated by JS -->
  </main>

  <footer class="footer">
    <div class="container">
      <div class="footer-bottom">
        <p style="font-size: 0.75rem; color: var(--text-dark);">© 2026 SIM Racing Nigeria. All rights reserved.</p>
        <div style="display: flex; gap: 1.25rem;">
          <a href="members.html" style="font-size: 0.75rem; color: var(--text-dark);">Back to Members</a>
          <a href="contact.html" style="font-size: 0.75rem; color: var(--text-dark);">Contact</a>
        </div>
      </div>
    </div>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const esc = SRN.esc;
      const id = getQueryParam('id');
      const RIGS = (await SRN.rigs()).rigs;
      const member = (await SRN.member(id)).member;
      const container = document.getElementById('profile-container');

      if (!member) {
        container.innerHTML = `
          <div class="container" style="padding-top: 10rem; padding-bottom: 6rem; text-align: center;">
            <h1 style="font-family: var(--font-display); font-size: 2rem; font-weight: 900; color: #FFF; margin-bottom: 1rem;">Member Not Found</h1>
            <a href="members.html" style="color: var(--accent-green); font-size: 0.875rem; font-weight: 600;">← Back to Members</a>
          </div>
        `;
        return;
      }

      document.title = `${member.name} — SIM Racing NG`;

      const rig = RIGS.find(r => r.ownerId === member.id);

      container.innerHTML = `
        <header class="page-header">
          <div class="container container-medium">
            <a href="members.html" style="display: inline-block; color: var(--text-dim); font-size: 0.75rem; font-weight: 600; margin-bottom: 1.5rem;">← Back to Members</a>
            <div style="display: flex; gap: 1.5rem; align-items: center; flex-wrap: wrap;">
              <div style="width: 7rem; height: 7rem; border-radius: 1rem; overflow: hidden; border: 2px solid rgba(0,230,118,0.4); shrink: 0;">
                <img src="${esc(member.avatar)}" alt="${esc(member.name)}" style="width: 100%; height: 100%; object-fit: cover;" />
              </div>
              <div>
                <span class="badge badge-solid-green">${esc(member.rank)}</span>
                <h1 style="font-family: var(--font-display); font-size: clamp(1.75rem, 3.5vw, 2.5rem); font-weight: 900; color: #FFF; margin-top: 0.5rem; margin-bottom: 0.25rem;">${esc(member.name)}</h1>
                <p style="font-size: 0.875rem; color: var(--text-muted);">${esc(member.city)} · Primarily races ${esc(member.sim)} · Joined ${esc(member.joined)}</p>
              </div>
            </div>
          </div>
        </header>

        <section class="section-py" style="background-color: var(--bg-dark);">
          <div class="container container-medium grid grid-cols-1 grid-cols-3-lg">
            <div style="grid-column: span 2; display: flex; flex-direction: column; gap: 2.5rem;">
              <div>
                <h2 style="font-family: var(--font-display); font-size: 0.75rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--accent-green); margin-bottom: 1rem;">Bio</h2>
                <p style="font-size: 0.95rem; color: var(--text-muted); line-height: 1.7;">${esc(member.bio || '')}</p>
              </div>

              <div>
                <h2 style="font-family: var(--font-display); font-size: 0.75rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--accent-orange); margin-bottom: 1rem;">Activity History</h2>
                <div style="display: flex; flex-direction: column; gap: 1rem;">
                  ${(member.activity || []).map(a => `
                    <div style="display: flex; gap: 1rem; padding-bottom: 1rem; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 0.875rem;">
                      <span style="color: var(--text-dim); width: 6rem; shrink: 0;">${esc(a.date)}</span>
                      <span style="color: var(--text-muted);">${esc(a.text)}</span>
                    </div>
                  `).join('')}
                </div>
              </div>

              ${rig ? `
                <div>
                  <h2 style="font-family: var(--font-display); font-size: 0.75rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--accent-green); margin-bottom: 1rem;">Sim Rig</h2>
                  <a href="sim-rigs.html?id=${rig.id}" class="card" style="padding: 1rem; display: flex; align-items: center; gap: 1rem;">
                    <img src="${rig.img}" alt="${rig.name}" style="width: 5rem; height: 4rem; object-fit: cover; border-radius: 8px;" />
                    <div>
                      <div style="font-weight: 700; color: #FFF; font-size: 0.875rem;">${rig.name}</div>
                      <div style="font-size: 0.75rem; color: var(--text-dim);">View full build →</div>
                    </div>
                  </a>
                </div>
              ` : ''}
            </div>

            <div style="display: flex; flex-direction: column; gap: 1.5rem;">
              <div class="card" style="padding: 1.5rem;">
                <h3 style="font-family: var(--font-display); font-size: 0.75rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--text-dim); margin-bottom: 1.25rem;">Stats</h3>
                <div style="display: flex; flex-direction: column; gap: 1rem;">
                  <div style="display: flex; justify-content: space-between; align-items: center;">
                    <span style="font-size: 0.875rem; color: var(--text-muted);">Races</span>
                    <span style="font-family: var(--font-display); font-size: 1.15rem; font-weight: 900; color: var(--accent-green);">${(member.stats || {}).races}</span>
                  </div>
                  <div style="display: flex; justify-content: space-between; align-items: center;">
                    <span style="font-size: 0.875rem; color: var(--text-muted);">Wins</span>
                    <span style="font-family: var(--font-display); font-size: 1.15rem; font-weight: 900; color: var(--accent-green);">${(member.stats || {}).wins}</span>
                  </div>
                  <div style="display: flex; justify-content: space-between; align-items: center;">
                    <span style="font-size: 0.875rem; color: var(--text-muted);">Podiums</span>
                    <span style="font-family: var(--font-display); font-size: 1.15rem; font-weight: 900; color: var(--accent-green);">${(member.stats || {}).podiums}</span>
                  </div>
                </div>
              </div>

              <button disabled title="Messaging isn't wired up yet" class="btn btn-outline-green" style="opacity: 0.5; cursor: not-allowed; width: 100%;">SEND MESSAGE</button>
            </div>
          </div>
        </section>
      `;
    });
  </script>
</body>
</html>
