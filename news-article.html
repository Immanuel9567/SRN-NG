<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Article — SIM Racing NG</title>
  <meta name="description" content="Read article on SIM Racing Nigeria." />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <div class="container navbar-container">
      <a href="index.html" class="navbar-brand">
        <svg width="140" height="32" viewBox="0 0 200 45" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect width="45" height="45" rx="10" fill="#00E676"/>
          <path d="M12 33L22 12L32 33" stroke="#08080C" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M16 26H28" stroke="#08080C" stroke-width="4.5" stroke-linecap="round"/>
          <text x="58" y="24" fill="#FFFFFF" font-family="Orbitron, sans-serif" font-weight="900" font-size="16" letter-spacing="1">SIM RACING</text>
          <text x="58" y="38" fill="#00E676" font-family="Orbitron, sans-serif" font-weight="700" font-size="11" letter-spacing="3">NIGERIA</text>
        </svg>
      </a>

      <div class="navbar-links">
        <a href="gallery.html" class="nav-link">Gallery</a>
        <a href="activities.html" class="nav-link">Activities</a>
        <a href="news.html" class="nav-link">News</a>
        <a href="members.html" class="nav-link">Members</a>
        <a href="sim-rigs.html" class="nav-link">Rigs</a>
        <a href="media.html" class="nav-link">Media</a>
        <a href="shop.html" class="nav-link">Shop</a>
        <a href="about.html" class="nav-link">About</a>
      </div>

      <div class="navbar-actions">
        <a href="members.html" class="btn btn-outline-green">JOIN NOW</a>
      </div>

      <button class="mobile-toggle" aria-label="Toggle Navigation">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>
    </div>

    <!-- Mobile Drawer -->
    <div class="mobile-menu">
      <a href="gallery.html" class="mobile-nav-link">Gallery</a>
      <a href="activities.html" class="mobile-nav-link">Activities</a>
      <a href="news.html" class="mobile-nav-link">News</a>
      <a href="members.html" class="mobile-nav-link">Members</a>
      <a href="sim-rigs.html" class="mobile-nav-link">Rigs</a>
      <a href="media.html" class="mobile-nav-link">Media</a>
      <a href="shop.html" class="mobile-nav-link">Shop</a>
      <a href="about.html" class="mobile-nav-link">About</a>
      <a href="members.html" class="btn btn-primary" style="margin-top: 0.5rem; text-align: center;">JOIN NOW</a>
    </div>
  </nav>

  <main id="article-content">
    <!-- Rendered dynamically by JS -->
  </main>

  <footer class="footer">
    <div class="container">
      <div class="footer-bottom">
        <p style="font-size: 0.75rem; color: var(--text-dark);">© 2026 SIM Racing Nigeria. All rights reserved.</p>
        <div style="display: flex; gap: 1.25rem;">
          <a href="news.html" style="font-size: 0.75rem; color: var(--text-dark);">Back to News</a>
          <a href="contact.html" style="font-size: 0.75rem; color: var(--text-dark);">Contact</a>
        </div>
      </div>
    </div>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const slug = getQueryParam('slug');
      const article = getArticle(slug);
      const container = document.getElementById('article-content');

      if (!article) {
        container.innerHTML = `
          <div class="container" style="padding-top: 10rem; padding-bottom: 6rem; text-align: center;">
            <h1 style="font-family: var(--font-display); font-size: 2rem; font-weight: 900; color: #FFF; margin-bottom: 1rem;">Article Not Found</h1>
            <a href="news.html" style="color: var(--accent-green); font-size: 0.875rem; font-weight: 600;">← Back to News</a>
          </div>
        `;
        return;
      }

      document.title = `${article.title} — SIM Racing NG`;

      const related = NEWS.filter(n => n.slug !== article.slug && n.tag === article.tag).slice(0, 3);
      const fallbackRelated = related.length ? related : NEWS.filter(n => n.slug !== article.slug).slice(0, 3);

      container.innerHTML = `
        <article>
          <header class="page-header" style="background-color: var(--bg-alt); border-bottom: none;">
            <div class="container container-narrow">
              <a href="news.html" style="display: inline-block; color: var(--text-dim); font-size: 0.75rem; font-weight: 600; margin-bottom: 1.5rem;">← Back to News</a>
              <div><span class="badge badge-solid-orange">${article.tag}</span></div>
              <h1 style="font-family: var(--font-display); font-size: clamp(1.75rem, 4vw, 3rem); font-weight: 900; color: #FFF; margin-top: 1rem; margin-bottom: 1rem; line-height: 1.2;">${article.title}</h1>
              <div style="font-size: 0.75rem; color: var(--text-dim);">By ${article.author} · ${article.date} · ${article.readTime}</div>
            </div>
          </header>

          <div class="container container-narrow" style="padding-top: 2rem; padding-bottom: 4rem;">
            <div style="border-radius: 1rem; overflow: hidden; height: 22rem; margin-bottom: 2.5rem;">
              <img src="${article.img}" alt="${article.title}" style="width: 100%; height: 100%; object-fit: cover;" />
            </div>

            <div style="display: flex; flex-direction: column; gap: 1.25rem; font-size: 0.95rem; color: var(--text-muted); line-height: 1.7;">
              ${article.body.map(p => `<p>${p}</p>`).join('')}
            </div>
          </div>

          ${fallbackRelated.length > 0 ? `
            <section style="background-color: var(--bg-alt); padding: 4rem 0; border-top: 1px solid var(--border-subtle);">
              <div class="container container-medium">
                <h2 style="font-family: var(--font-display); font-size: 0.75rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--accent-green); margin-bottom: 1.5rem;">More Stories</h2>
                <div class="grid grid-cols-1 grid-cols-3-sm">
                  ${fallbackRelated.map(n => `
                    <a href="news-article.html?slug=${n.slug}" class="card" style="display: block;">
                      <div style="height: 8rem; overflow: hidden;">
                        <img src="${n.img}" alt="${n.title}" style="width: 100%; height: 100%; object-fit: cover;" />
                      </div>
                      <div style="padding: 1rem;">
                        <h3 style="font-size: 0.875rem; font-weight: 700; color: #FFF; line-height: 1.3;">${n.title}</h3>
                      </div>
                    </a>
                  `).join('')}
                </div>
              </div>
            </section>
          ` : ''}
        </article>
      `;
    });
  </script>
</body>
</html>
