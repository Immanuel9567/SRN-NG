  <script>
    // Apply the saved theme before first paint so the palette never flashes.
    (function () {
      var mode = 'auto';
      try { mode = localStorage.getItem('srn-theme') || 'auto'; } catch (e) {}
      var light = mode === 'light' ||
        (mode === 'auto' && typeof window.matchMedia === 'function' &&
          window.matchMedia('(prefers-color-scheme: light)').matches);
      document.documentElement.setAttribute('data-theme', light ? 'light' : 'dark');
    })();
  </script>
</head>
<body>

  <!-- Sticky sub-header: back link and theme switcher -->
  <div class="sticky-subhead">
    <a href="index.html" class="subhead-logo" aria-label="SIM Racing Nigeria home">
      <img src="media/logo.png" alt="SIM Racing Nigeria" />
    </a>
    <a class="subhead-back" href="news.html">&larr; Back to News</a>
    <div class="subhead-tools">
        <button type="button" class="subhead-search" data-palette-open aria-label="Search (Ctrl+K)" title="Search (Ctrl+K)"><iconify-icon icon="mdi:magnify" width="15" height="15"></iconify-icon><span>Search</span><kbd>Ctrl K</kbd></button>
      <a href="admin.html" class="subhead-admin" data-admin-entry hidden>Admin</a>

    </div>
    <div class="theme-switch" role="group" aria-label="Colour theme">
      <button type="button" data-theme="light" aria-label="Light theme" title="Light theme"><iconify-icon icon="line-md:sunny" width="15" height="15"></iconify-icon></button>
      <button type="button" data-theme="dark" aria-label="Dark theme" title="Dark theme"><iconify-icon icon="line-md:moon" width="15" height="15"></iconify-icon></button>
      <button type="button" data-theme="auto" aria-label="Match device theme" title="Match device theme"><iconify-icon icon="mdi:monitor" width="15" height="15"></iconify-icon></button>
    </div>
  </div>


  <!-- Navbar -->
  <nav class="navbar">
    <div class="container navbar-container">

        <img src="media/logo.png" alt="SIM Racing Nigeria" style="height: 2.25rem; width: auto;" />

      <div class="navbar-actions">
        <span data-account-slot style="display: inline-flex; align-items: center; gap: 0.75rem;">
          <a href="account.html?mode=signin" class="btn btn-outline-light">SIGN IN</a>
        </span>
      </div>

      <button class="mobile-toggle" aria-label="Toggle Navigation">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>

    <!-- Mobile Drawer -->
    <div class="mobile-menu">
      <a href="index.html" class="mobile-nav-link">Home</a>
      <a href="gallery.html" class="mobile-nav-link">Gallery</a>

      <a href="media.html" class="mobile-nav-link">Media</a>

      <a href="about.html" class="mobile-nav-link">About</a>
      <div data-account-slot style="display: flex; flex-direction: column; gap: 0.5rem; margin-top: 0.5rem;">
        <a href="account.html" class="btn btn-primary" style="text-align: center;">SIGN UP</a>

      </div>

  <main id="article-content">
    <!-- Rendered dynamically by JS -->
  </main>

  <script src="js/data.js"></script>
  <script src="js/api.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const esc = SRN.esc;
      const slug = getQueryParam('slug');
      const { articles: all } = await SRN.news();
      const article = all.find(n => n.slug === slug);
      const container = document.getElementById('article-content');

      if (!article) {
        container.innerHTML = `
          <div class="container" style="padding-top: 10rem; padding-bottom: 6rem; text-align: center;">
            <h1 style="font-family: var(--font-display); font-size: 2rem; font-weight: 900; color: #FFF; margin-bottom: 1rem;">Article Not Found</h1>
            <a href="news.html" style="color: var(--accent-green); font-size: 0.875rem; font-weight: 600;">← Back to News</a>
          </div>
        `;
        return;
      }

      document.title = `${article.title} — SIM Racing NG`;
      // Share previews: mirror the article into the OG/Twitter tags.
      const ogTitle = document.querySelector('meta[property="og:title"]');
      const ogDesc = document.querySelector('meta[property="og:description"]');
      const ogImg = document.querySelector('meta[property="og:image"]');
      if (ogTitle) ogTitle.content = article.title;
      if (ogDesc) ogDesc.content = article.excerpt || document.querySelector('meta[name="description"]')?.content || '';
      if (ogImg && article.img) ogImg.content = article.img;

      const related = all.filter(n => n.slug !== article.slug && n.tag === article.tag).slice(0, 3);
      const fallbackRelated = related.length ? related : all.filter(n => n.slug !== article.slug).slice(0, 3);

      container.innerHTML = `
        <article>
          <header class="page-header" style="background-color: var(--bg-alt); border-bottom: none;">
            <div class="container container-narrow">
              <a href="news.html" style="display: inline-block; color: var(--text-dim); font-size: 0.75rem; font-weight: 600; margin-bottom: 1.5rem;">← Back to News</a>
              <div><span class="badge badge-solid-orange">${esc(article.tag)}</span></div>
              <h1 style="font-family: var(--font-display); font-size: clamp(1.75rem, 4vw, 3rem); font-weight: 900; color: #FFF; margin-top: 1rem; margin-bottom: 1rem; line-height: 1.2;">${esc(article.title)}</h1>
              <div style="font-size: 0.75rem; color: var(--text-dim);">By ${esc(article.author)} · ${esc(article.date)} · ${esc(article.readTime)}</div>
            </div>
          </header>

          <div class="container container-narrow" style="padding-top: 2rem; padding-bottom: 4rem;">
            <div style="border-radius: 1rem; overflow: hidden; height: 22rem; margin-bottom: 2.5rem;">
              <img src="${esc(article.img)}" alt="${esc(article.title)}" style="width: 100%; height: 100%; object-fit: cover;" />
            </div>

            <div style="display: flex; flex-direction: column; gap: 1.25rem; font-size: 0.95rem; color: var(--text-muted); line-height: 1.7;">
              ${article.body.map(p => `<p>${esc(p)}</p>`).join('')}
            </div>

            <div class="srn-reactions" id="reaction-bar" aria-label="Reactions"></div>

            <section class="srn-comments" id="pit-wall" aria-label="Comments">
              <h2 style="font-family: var(--font-display); font-size: 0.75rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--accent-green); margin-bottom: 1.25rem;">
                Pit Wall <span class="srn-comment-count" id="cmt-count">0</span>
              </h2>
              <div id="cmt-list" style="display: flex; flex-direction: column; gap: 0.75rem;"></div>
              <div id="cmt-form-zone" style="margin-top: 1.5rem;"></div>
            </section>
          </div>

          ${fallbackRelated.length > 0 ? `
            <section style="background-color: var(--bg-alt); padding: 4rem 0; border-top: 1px solid var(--border-subtle);">
              <div class="container container-medium">
                <h2 style="font-family: var(--font-display); font-size: 0.75rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--accent-green); margin-bottom: 1.5rem;">More Stories</h2>
                <div class="grid grid-cols-1 grid-cols-3-sm">
                  ${fallbackRelated.map(n => `
                    <a href="news-article.html?slug=${n.slug}" class="card" style="display: block;">
                      <div style="height: 8rem; overflow: hidden;">
                        <img src="${n.img}" alt="${n.title}" style="width: 100%; height: 100%; object-fit: cover;" />
                      </div>
                      <div style="padding: 1rem;">
                        <h3 style="font-size: 0.875rem; font-weight: 700; color: #FFF; line-height: 1.3;">${n.title}</h3>
                      </div>
                    </a>
                  `).join('')}
                </div>
              </div>
            </section>
          ` : ''}
        </article>
      `;

      initPitWall(article.slug);
      initReactions(article.slug);
    });

    // Reaction bar: flag / fire / love / trophy, one toggle per kind per driver.
    // Counts are public; toggling needs a signed-in driver on the server.
    const REACTION_ICONS = { flag: 'mdi:flag-checkered', fire: 'mdi:fire', love: 'mdi:heart-outline', trophy: 'mdi:trophy-outline' };
    const REACTION_LABELS = { flag: 'Flag it', fire: 'On fire', love: 'Love it', trophy: 'Podium worthy' };

    async function initReactions(slug) {
      const bar = document.getElementById('reaction-bar');
      if (!bar) return;
      const esc = SRN.esc;
      let state;
      try {
        state = await SRN.reactions(slug);
      } catch { return; }
      const kinds = state.kinds && state.kinds.length ? state.kinds : Object.keys(REACTION_ICONS);
      const mine = new Set(state.mine || []);

      function draw() {
        bar.innerHTML = kinds.map((k) => `
          <button type="button" class="srn-react${mine.has(k) ? ' active' : ''}" data-kind="${esc(k)}"
                  aria-pressed="${mine.has(k)}" title="${esc(REACTION_LABELS[k] || k)}">
            <iconify-icon icon="${esc(REACTION_ICONS[k] || 'mdi:flag-checkered')}" width="16" height="16"></iconify-icon>
            <span>${Number(state.counts[k] || 0)}</span>
          </button>
        `).join('');
        bar.querySelectorAll('[data-kind]').forEach((btn) => {
          btn.addEventListener('click', async () => {
            const kind = btn.dataset.kind;
            btn.disabled = true;
            try {
              const out = await SRN.toggleReaction(slug, kind);
              state.counts = out.counts;
              if (out.active) mine.add(kind); else mine.delete(kind);
            } catch (err) {
              SRN.toast(err.message, 'error');
            } finally {
              btn.disabled = false;
              draw();
            }
          });
        });
      }
      draw();
    }

    // The pit wall: comments on this article. Reading works everywhere; posting
    // needs a signed-in driver on the real server (offline mode hides the form).
    async function initPitWall(slug) {
      const esc = SRN.esc;
      const listEl = document.getElementById('cmt-list');
      const countEl = document.getElementById('cmt-count');
      const zoneEl = document.getElementById('cmt-form-zone');
      if (!listEl || !countEl || !zoneEl) return;

      function render(list) {
        countEl.textContent = String(list.length);
        if (!list.length) {
          listEl.innerHTML = '<p style="color: var(--text-dim); font-size: 0.875rem;">No comments yet. Set the pace.</p>';
          return;
        }
        listEl.innerHTML = list.map((c) => `
          <div class="srn-comment">
            <img class="srn-comment-avatar" src="${esc(c.avatar || 'media/placeholder.png')}" alt="" onerror="this.src='media/placeholder.png'" />
            <div>
              <div class="srn-comment-meta"><strong>${esc(c.username)}</strong> · ${esc((c.createdAt || '').slice(0, 10))}</div>
              <div class="srn-comment-body">${esc(c.text)}</div>
            </div>
          </div>
        `).join('');
      }

      let comments = [];
      try {
        comments = (await SRN.comments(slug)).comments || [];
      } catch { /* static build: keep the empty state */ }
      render(comments);

      const user = await SRN.me().catch(() => null);
      if (!user) {
        zoneEl.innerHTML = `
          <a href="account.html?mode=signin" class="btn btn-outline-light" style="display: inline-flex; align-items: center; gap: 0.5rem;">
            <iconify-icon icon="line-md:login" width="16" height="16"></iconify-icon> Sign in to join the pit wall
          </a>`;
        return;
      }
      zoneEl.innerHTML = `
        <form class="srn-comments-form" style="display: flex; flex-direction: column; gap: 0.75rem;">
          <textarea class="input-field" maxlength="600" placeholder="Radio check. What did you think of this one?" aria-label="Write a comment"></textarea>
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <span style="font-size: 0.75rem; color: var(--text-dim);">Be quick but never rude.</span>
            <button type="submit" class="btn btn-primary" style="padding: 0.6rem 1.4rem;">Post comment</button>
          </div>
        </form>`;
      const form = zoneEl.querySelector('form');
      const textarea = zoneEl.querySelector('textarea');
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const text = textarea.value.trim();
        if (!text) return;
        const btn = form.querySelector('button');
        btn.disabled = true;
        try {
          const { comment } = await SRN.postComment(slug, text);
          comments = [comment, ...comments];
          render(comments);
          textarea.value = '';
          SRN.toast('Comment posted.', 'success');
        } catch (err) {
          SRN.toast(err.message, 'error');
        } finally {
          btn.disabled = false;
        }
      });
    }
  </script>
</body>
